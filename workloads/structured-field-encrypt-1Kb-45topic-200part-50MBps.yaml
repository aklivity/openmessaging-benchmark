# Structured-field encryption workload. The 9096 listener runs model: json against the
# catalog subject test-topic-value, so the payload must be valid JSON matching that schema -
# payload-1Kb-event.json carries id/status/ssn, with ssn tagged x-kind: pii-encrypt.
# Same shape and rate as the whole-payload encrypted 1Kb run, for a like-for-like comparison.
name: structured-field-encrypt-1Kb-45topic-200part-50MBps

topics: 45
partitionsPerTopic: 200
messageSize: 1024
payloadFile: "payload/payload-1Kb-event.json"
keyDistributor: "NO_KEY"

producersPerTopic: 1
subscriptionsPerTopic: 3
consumerPerSubscription: 1

producerRate: 51200
consumerBacklogSizeGB: 0

warmupDurationMinutes: 30
testDurationMinutes: 60
