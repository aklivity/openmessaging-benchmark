name: Kafka
driverClass: io.openmessaging.benchmark.driver.kafka.KafkaBenchmarkDriver

# Zilla Plus structured-field encrypt listener (port 9096): only the schema fields tagged
# x-kind: pii-encrypt are encrypted, so payloads must be valid JSON matching the catalog
# subject test-topic-value. Keep the "zilla-structured-encrypt-kafka-*.yaml" filename
# prefix - deploy.yaml matches on it to rewrite bootstrap.servers with the right port.

# Kafka client-specific configuration
replicationFactor: 3
reset: true
skipCreateTopic: false
topicPrefix: test-topic

topicConfig: |
  min.insync.replicas=2

commonConfig: |
  bootstrap.servers=SASL_SSL://zilla.external.net:9096
  security.protocol=SASL_SSL
  sasl.mechanism=PLAIN
  sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="benchmark" password="benchmark";
  ssl.endpoint.identification.algorithm=
  ssl.truststore.location=/opt/benchmark/zilla.client.truststore.jks
  ssl.truststore.password=generated
  request.timeout.ms=300000

producerConfig: |
  acks=all
  linger.ms=10

consumerConfig: |
  auto.offset.reset=earliest
  enable.auto.commit=true
